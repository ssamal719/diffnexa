# Written by hand: a deterministic comparison result, what the scripted model replies,
# and what DiffNexa must then show. See golden/ai-cases/README.md.
case: excel-formula-change
description: "A formula changes; the explanation says what the formula now does, without predicting business effects."
tool: excel
source: {"pair": "formula-change"}
provider: {"replies": ["reply.json"]}
expect: {"status": "complete", "explained": ["c0", "c1"], "withheld": 0, "must_not_display": ["revenue"]}
