# Written by hand: a deterministic comparison result, what the scripted model replies,
# and what DiffNexa must then show. See golden/ai-cases/README.md.
case: excel-value-change
description: "Four values change in a workbook; each explanation cites its own cells."
tool: excel
source: {"pair": "number-change"}
provider: {"replies": ["reply.json"]}
expect: {"status": "complete", "explained": ["c0", "c1", "c2", "c3"], "withheld": 0}
