# Written by hand: what really changed between these two versions of a
# competitor's page, and the one signal each change must receive.
pair: ordinary-link-changed
description: The blog link now points to a news page.
expected_changes:
- old: https://competitor.example.com/blog
  new: https://competitor.example.com/news
  category: link
  match: exact
  signal: links_destinations
forbidden_signals: [calls_to_action, other]
