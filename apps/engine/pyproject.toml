[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diffnexa-engine"
version = "0.1.0"
description = "DiffNexa PDF comparison engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7,<3",
  "pdfplumber>=0.11.4,<0.12",
  "pikepdf>=9,<11",
  "PyYAML>=6,<7",
  "lxml>=5,<7",
]

[project.optional-dependencies]
service = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "reportlab>=4.2,<6",
  "python-docx>=1.1,<2",
  "ruff>=0.6",
]

[project.scripts]
diffnexa = "diffnexa_engine.cli:main"

[tool.setuptools.packages.find]
include = ["diffnexa_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS templates are clearer on one line.
"diffnexa_engine/reports/*.py" = ["E501"]
"diffnexa_engine/golden/runner.py" = ["E501"]
# FastAPI declares request parameters as argument defaults; that is its API.
"diffnexa_engine/service/app.py" = ["B008"]
