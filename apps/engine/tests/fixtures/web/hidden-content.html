<!doctype html><html><body><main>
<h1>Visible Heading</h1>
<p>This paragraph is visible to readers.</p>
<p style="display:none">Hidden by inline style and must not be extracted.</p>
<p style="visibility: hidden;">Also hidden and must not be extracted.</p>
<p hidden>Hidden attribute and must not be extracted.</p>
<p aria-hidden="true">Aria hidden and must not be extracted.</p>
<p class="sr-only">Screen reader text which is genuine content.</p>
</main></body></html>
